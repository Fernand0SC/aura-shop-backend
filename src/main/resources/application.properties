spring.application.name=aurashop

# Base de datos H2
spring.datasource.url=jdbc:h2:file:./data/aurashop
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA: crea y actualiza las tablas desde las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true

# JWT
jwt.secret=${JWT_SECRET:aura-shop-clave-secreta-de-desarrollo-2026-minimo-32-caracteres}
jwt.access-ms=900000
jwt.refresh-ms=604800000

# CORS (origen del frontend)
app.cors.origins=http://localhost:5173

# Contraseña de los usuarios de demostración
app.seed.password=${SEED_PASSWORD:Aura#2026demo}